server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Liveness probe for Docker / orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fingerprinted build assets: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The CV is always served as a download.
    location /cv/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    # Everything else (index.html, images, theme-init.js): short cache, revalidate.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # Single-page app: unknown paths fall back to index.html.
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (.git, .env, ...).
    location ~ /\. {
        deny all;
        return 404;
    }
}
