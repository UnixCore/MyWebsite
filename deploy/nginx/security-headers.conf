# Included in every location block (nginx drops parent add_header directives
# as soon as a location declares its own, so they live in one snippet).
#
# Keep in sync with public/_headers (used by Netlify and Cloudflare Pages).

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Enable only once the site is served over HTTPS (e.g. behind Caddy/Traefik/Cloudflare):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
